name: Build Nabu UniXNU UEFI

on:
  workflow_dispatch:

jobs:
  build-nabu-uefi:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Mu-Silicium
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout UniXNU (for DarwinBootPkg)
        uses: actions/checkout@v4
        with:
          repository: Lux12138/UniXNU
          path: UniXNU

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential uuid-dev iasl nasm python3-pip clang lld llvm gcc-aarch64-linux-gnu mono-complete ca-certificates-mono
          pip install -r pip-requirements.txt

      - name: Link DarwinBootPkg & Patch nabu APRIORI
        run: |
          ln -s "$PWD/UniXNU/DarwinBootPkg" "$PWD/DarwinBootPkg"
          APRIORI_FILE=$(find Silicium-ACPI/Platforms/Xiaomi/nabu* -name "APRIORI.inc" | head -n 1)
          if [ -n "$APRIORI_FILE" ]; then
            sed -i '/APRIORI DXE {/a \    INF DarwinBootPkg/Driver/DarwinBoot.inf' "$APRIORI_FILE"
          fi

      - name: Build UEFI for nabu
        run: |
          python3 build_uefi.py -d nabu -r RELEASE

      - name: Upload UEFI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nabu-uefi-unixnu
          path: |
            Build/**/*.img
            Build/**/*.fd
            Build/**/BootShim.bin
